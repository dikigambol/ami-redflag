<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d24"/>
      <stop offset="100%" stop-color="#090e12"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c9182b"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="flagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff4757" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#22323f" stroke-width="2"/>

  <!-- Flagpole -->
  <line x1="20" y1="14" x2="20" y2="50" stroke="url(#poleGrad)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="13" r="3" fill="#ffffff"/>

  <!-- Waving Red Flag -->
  <path d="M 22 15 
           C 29 11.5, 37 18.5, 46 15 
           L 46 33 
           C 37 36.5, 29 29.5, 22 33 
           Z" 
        fill="url(#flagGrad)" 
        filter="url(#flagShadow)"/>

  <!-- Subtle Accent Highlight on Flag fold -->
  <path d="M 22 15 C 29 11.5, 37 18.5, 46 15 L 46 17 C 37 20.5, 29 13.5, 22 17 Z" fill="#ffffff" opacity="0.15"/>
</svg>
